[package]
name = "mfp"
version = "0.1.0"
description = "MFP (MageneFirmwarePlayground) local desktop shell"
edition = "2021"

# ⚠️ 本目录为脚手架：本机未装 Rust，尚未编译验证。编译 / 打包见 Issue #6（联调与打包）。

[lib]
name = "mfp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
